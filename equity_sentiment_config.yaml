project:
  article_scores: data/policy_sentiment/article_policy_sentiment.csv
  topic_definitions: policy_topic_definitions_v1.json
  output_dir: data/equity_sentiment
  figure_dir: figures/equity_sentiment
  start_date: '2026-07-10'
  end_date_inclusive: '2026-10-09'
  yfinance_end_exclusive: '2026-10-10'
  price_download_start: '2026-07-01'
  timezone: America/New_York

universe:
  target_max_stocks: 1000
  snapshot_rule: current_or_closest_publicly_available_snapshot
  sp500_url: https://en.wikipedia.org/wiki/List_of_S%26P_500_companies
  nasdaq100_url: https://api.nasdaq.com/api/quote/list-type/nasdaq100
  russell1000_proxy_url: https://www.ishares.com/us/products/239707/ishares-russell-1000-etf/latest-holdings.csv
  russell1000_proxy_name: iShares Russell 1000 ETF (IWB) holdings
  note: Public historical constituent files were not available from these endpoints; actual source dates are recorded and survivor bias is retained as a limitation.

prices:
  benchmark: SPY
  sector_etfs:
    0: XLK
    1: XLI
    2: XLV
    3: XLE
    4: XLY
    5: ITA
  interval: 1d
  auto_adjust: false
  actions: true
  repair: false
  batch_size: 50
  timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 3
  minimum_stock_trading_days: 30
  outlier_abs_return_threshold: 0.50

signals:
  index_types:
    - topic_sentiment
    - democrat_stance
    - republican_stance
  success_statuses:
    - success
    - cached
  section_group: All
  low_sample_articles: 3
  aggregation: article_level_lda_probability_weighted
  window: previous_trading_day_00_00_to_target_trading_day_00_00_exclusive

regression:
  minimum_observations: 30
  near_constant_tolerance: 1.0e-10
  hac_maxlags: 5
  confidence_level: 0.95
  block_bootstrap_length: 5
  block_bootstrap_repetitions: 500
  random_seed: 42
  fdr_alpha: 0.05
  exploratory_q: 0.10

walk_forward:
  minimum_training_pairs: 30
  minimum_predictions_for_evidence: 15
  zero_direction_tolerance: 1.0e-12

joint_models:
  max_sentiment_variables: 3
  minimum_observations: 30
  observations_per_parameter: 10
  predefined:
    - name: AMZN_T0_T4_topic_sentiment
      ticker: AMZN
      index_type: topic_sentiment
      topic_ids: [0, 4]
    - name: WMT_T2_T4_topic_sentiment
      ticker: WMT
      index_type: topic_sentiment
      topic_ids: [2, 4]
    - name: XOM_T1_T3_topic_sentiment
      ticker: XOM
      index_type: topic_sentiment
      topic_ids: [1, 3]
    - name: PWR_T1_T3_topic_sentiment
      ticker: PWR
      index_type: topic_sentiment
      topic_ids: [1, 3]
    - name: LMT_T3_T5_topic_sentiment
      ticker: LMT
      index_type: topic_sentiment
      topic_ids: [3, 5]
    - name: RTX_T3_T5_topic_sentiment
      ticker: RTX
      index_type: topic_sentiment
      topic_ids: [3, 5]

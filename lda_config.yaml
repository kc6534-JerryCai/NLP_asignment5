preprocessing:
  spacy_model: en_core_web_sm
  spacy_batch_size: 24
  min_token_length: 3
  min_document_tokens: 30
  phrase_min_count: 5
  phrase_threshold: 10.0
  no_below: 5
  no_above: 0.8
  # Conservative additions only. Party, person, institution and policy terms
  # are intentionally not removed.
  custom_stopwords:
    - guardian
    - reuters
    - newsletter
    - cookie
    - advertisement
    - say
    - tell
    - report
    - write
    - include
    - year
    - people
    - time
    - come
    - think
    - want
    - like
    - call
    - new
    - work
    - country
    - day
    - week
  custom_stopword_log:
    guardian: publisher boilerplate rather than article subject
    reuters: wire-service attribution rather than article subject
    newsletter: page/newsletter template language
    cookie: web template language
    advertisement: web template language
    say: high-frequency reporting verb with low topical specificity
    tell: high-frequency reporting verb with low topical specificity
    report: high-frequency reporting verb with low topical specificity
    write: high-frequency attribution verb with low topical specificity
    include: generic enumeration verb that appeared across otherwise unrelated topics
    year: generic time word that appeared across otherwise unrelated topics
    people: generic noun that appeared across otherwise unrelated topics
    time: generic time word with low topical specificity
    come: generic verb with low topical specificity
    think: generic speech/cognition verb with low topical specificity
    want: generic preference verb with low topical specificity
    like: generic comparison/speech word with low topical specificity
    call: generic reporting/action verb with low topical specificity
    new: generic modifier with low topical specificity
    work: generic activity verb/noun with low topical specificity
    country: generic geography noun that did not distinguish policy topics
    day: generic time word with low topical specificity
    week: generic time word with low topical specificity

lda:
  candidate_topics: [5, 8, 10]
  selected_k: 10
  random_state: 42
  stability_seeds: [7, 99]
  passes: 10
  iterations: 100
  alpha: auto
  eta: auto
  topn_keywords: 15
  representative_articles: 10
  candidate_representative_articles: 5
  candidate_selection_notes:
    5: compact model but representative articles combined several substantively distinct issues and keyword overlap was highest
    8: lower coherence and less clear separation in representative articles
    10: recommended because it had the highest final coherence, the lowest mean keyword overlap, and clearer separation of election administration, electoral competition, the economy, war, public health, and congressional activity

# Filled after candidate-model interpretation. Names are human interpretations,
# not direct model output.
topic_labels:
  0:
    english_name: Senate Succession and Political Movements
    chinese_name: 参议院继任与政治运动
    definition: Candidate succession, political movements, and their effects on party competition in Senate and congressional races.
    category: campaign_process_or_election_strategy
    naming_basis: Graham succession coverage and articles on progressive movements and candidates dominate the representative set.
    naming_status: provisional_human_interpretation_pending_confirmation
  1:
    english_name: Iran War and Foreign Policy
    chinese_name: 伊朗战争与外交政策
    definition: US military action, diplomacy, and political consequences surrounding Iran and the wider Middle East.
    category: policy_or_social_issue
    naming_basis: Iran, war, attack, military, strike, and diplomacy terms align with the highest-probability articles.
    naming_status: provisional_human_interpretation_pending_confirmation
  2:
    english_name: Justice Department and Executive Oversight
    chinese_name: 司法部与行政监督
    definition: Appointments, hearings, investigations, and institutional checks involving the Justice Department and executive branch.
    category: mixed_or_unclear
    naming_basis: Todd Blanche hearings and Justice Department oversight lead the representative articles, with some adjacent institutional disputes.
    naming_status: provisional_human_interpretation_pending_confirmation
  3:
    english_name: Election Administration and Voting Rights
    chinese_name: 选举管理与投票权
    definition: Federal and state control of election rules, ballots, monitoring, and voting access.
    category: campaign_process_or_election_strategy
    naming_basis: Election, voter, ballot, voting, court, and rule terms match articles on federal election powers and mail voting.
    naming_status: provisional_human_interpretation_pending_confirmation
  4:
    english_name: Political Culture and Executive Conduct
    chinese_name: 政治文化与行政行为
    definition: Public controversy over presidential rhetoric, authoritarian conduct, gender, media symbolism, and political spectacle.
    category: mixed_or_unclear
    naming_basis: Representative articles center cultural backlash and executive conduct, but the topic is substantively broad.
    naming_status: provisional_human_interpretation_pending_confirmation
  5:
    english_name: White House Personnel and Information Authority
    chinese_name: 白宫人事与信息权力
    definition: Senior appointments, intelligence leadership, press operations, and disputes about official truth and legitimacy.
    category: mixed_or_unclear
    naming_basis: Intelligence and press appointments, White House personnel, and election-legitimacy claims lead the representative set.
    naming_status: provisional_human_interpretation_pending_confirmation
  6:
    english_name: Public Health and Political Accountability
    chinese_name: 公共卫生与政治问责
    definition: Public-health controversies and hearings linked to political careers, accountability, and campaigning.
    category: mixed_or_unclear
    naming_basis: Fauci hearings and health-policy articles dominate, alongside political biographies and accountability stories.
    naming_status: provisional_human_interpretation_pending_confirmation
  7:
    english_name: Primaries and Candidate Competition
    chinese_name: 初选与候选人竞争
    definition: Party primaries, candidate recruitment, ideological competition, and strategies for winning congressional races.
    category: campaign_process_or_election_strategy
    naming_basis: Democrats, campaign, voter, candidate, primary, and race terms align with the representative campaign articles.
    naming_status: provisional_human_interpretation_pending_confirmation
  8:
    english_name: Congress, Legislation, and Public Spending
    chinese_name: 国会、立法与公共支出
    definition: Congressional voting, funding bills, foreign aid, and legislative conflict between the parties.
    category: policy_or_social_issue
    naming_basis: House, Senate, bill, pass, funding, and vote terms characterize the representative articles.
    naming_status: provisional_human_interpretation_pending_confirmation
  9:
    english_name: Economy, Tariffs, and Cost of Living
    chinese_name: 经济、关税与生活成本
    definition: Economic performance, trade and tariffs, inflation, prices, and affordability in the midterm context.
    category: policy_or_social_issue
    naming_basis: Tariff, economy, price, inflation, trade, rate, and cost terms align with the leading articles.
    naming_status: provisional_human_interpretation_pending_confirmation
